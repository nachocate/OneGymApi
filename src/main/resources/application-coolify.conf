include required("application.conf")

server.host = "0.0.0.0"
cors.allowed-origin = ""
cors.allowed-origin = ${?CORS_ALLOWED_ORIGIN}
media.root-directory = "/app/uploads"

database {
    url = ${DB_URL}
    user = ${DB_USER}
    password = ${DB_PASSWORD}
}

jwt {
    secret = ${JWT_SECRET}
    refresh-token-hash-secret = ${JWT_REFRESH_TOKEN_HASH_SECRET}
}
