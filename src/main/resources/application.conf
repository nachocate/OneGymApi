database {
    url = "jdbc:postgresql://localhost:5432/onegym_db"
    user = "local-user"
    password = "local-password"
    pool-size = 10
}

jwt {
    # Para desarrollo local. No subas secretos reales al repositorio ni uses
    # estos valores en producción; luego pueden reemplazarse por variables de entorno.
    secret = "onegym-development-jwt-secret-change-me-32chars"
    refresh-token-hash-secret = "onegym-development-refresh-secret-change-me-32chars"
    issuer = "onegym-api"
    audience = "onegym-clients"
    access-token-ttl-minutes = 15
    refresh-token-ttl-days = 30
}

# Optional local overrides, deliberately ignored by Git. It is where each
# developer keeps their PostgreSQL credentials.
include "application.local.conf"
